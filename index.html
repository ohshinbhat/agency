<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="First Run is a creative agency for tech companies. Product launches, video production, DevRel content, and Twitter writing and distribution.">
  <title>First Run — Ideas in motion.</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/barlow-condensed-latin-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/work-sans-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    if (location.protocol === 'file:') {
      const backdrop = new URL('./public/images/track-background.webp', location.href);
      document.documentElement.style.setProperty('--track-image', 'url("' + backdrop.href + '")');
    }
  </script>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <main>
    <div class="film-stage" id="top">
      <figure class="footage" aria-hidden="true">
        <canvas class="ascii-art"></canvas>
      </figure>
      <header class="header">
        <a class="brand" href="#top" aria-label="First Run home">FIRST RUN<span>.</span></a>
        <a class="button button-outline" href="mailto:hello@firstrun.agency">Start a project</a>
      </header>
      <div class="hero-copy">
        <h1 class="title">
          <span>Ideas in</span>
          <span class="motion-title">
            <span class="motion-title-layer motion-title-layer-back" aria-hidden="true">motion.</span>
            <span class="motion-title-layer motion-title-layer-front" aria-hidden="true">motion.</span>
            <span class="motion-title-face">motion.</span>
          </span>
        </h1>
        <p class="intro-copy">Launch strategy, video production, and Twitter writing and distribution for tech teams.</p>
      </div>
      <button class="motion-toggle" type="button">Pause animation</button>
    </div>
  </main>
  <script type="module" src="./src/race/story.js"></script>
</body>
</html>
